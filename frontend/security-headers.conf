# Included in every location that sets its own headers: nginx drops server-level add_header
# lines in a location that has any add_header of its own.
#
# Content-Security-Policy: scripts only from this site (no inline scripts), styles also from
# Google Fonts (inline style attributes are used by React), fonts from Google Fonts, and the
# browser may call this site's API and OpenStreetMap (for "Use my location"). If you build the
# frontend with VITE_API_BASE_URL on another origin, add that origin to connect-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://nominatim.openstreetmap.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
