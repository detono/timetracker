server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Rendered fresh from env vars on every container start (see docker-entrypoint.sh) -
    # never cache it, or a redeployment with different branding env vars could appear
    # to "not take effect" for anyone with an old cached copy.
    location = /config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Single-page app: fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxies to the API container over the internal Docker network, using the
    # "api" service name from docker-compose.yml. This means the browser only ever talks
    # to this one origin - no CORS, no separate port to expose or keep in sync, and the
    # same published image works regardless of what host/port this container ends up
    # running behind. Requires a Docker Compose service literally named "api" on the same
    # network (both docker-compose.yml and docker-compose.release.yml define one).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
